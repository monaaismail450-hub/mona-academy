<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1829"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b9eff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- Border ring -->
  <rect x="4" y="4" width="184" height="184" rx="34" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <!-- Tooth emoji centered -->
  <text x="96" y="118" font-size="80" text-anchor="middle" font-family="serif">🦷</text>
  <!-- Bottom text -->
  <text x="96" y="158" font-size="14" fill="url(#accent)" text-anchor="middle" font-family="Cairo,Arial" font-weight="700">منى الأكاديمي</text>
</svg>
